<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — SmartHR</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1e3a5f">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f2a4a, #1e3a5f, #0077b6);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: white; text-align: center; padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 48px 36px;
            max-width: 400px; width: 100%;
        }
        .icon {
            font-size: 72px; margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        h2 { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
        p  { opacity: 0.8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white; border: none; border-radius: 12px;
            padding: 13px 28px; font-size: 15px; font-weight: 600;
            cursor: pointer; text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
            width: 100%; margin-bottom: 10px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.4);
        }
        .status {
            margin-top: 20px; font-size: 12px; opacity: 0.6;
        }
        .dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: #ef4444;
            margin-right: 6px; animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h2>You're Offline</h2>
        <p>
            SmartHR needs an internet connection to scan attendance.<br>
            Check your WiFi or mobile data and try again.
        </p>
        <button class="btn" onclick="retryConnection()">
            🔄 Try Again
        </button>
        <a href="/employee/dashboard/" class="btn btn-outline">
            View Cached Records
        </a>
        <div class="status">
            <span class="dot"></span>
            No connection detected
        </div>
    </div>

    <script>
        function retryConnection() {
            fetch('/accounts/login/', { method: 'HEAD', cache: 'no-store' })
                .then(() => window.location.href = '/')
                .catch(() => {
                    document.querySelector('.status').innerHTML =
                        '<span class="dot"></span> Still offline. Check your connection.';
                });
        }
        // Auto-retry every 10 seconds
        setInterval(retryConnection, 10000);

        // Listen for online event
        window.addEventListener('online', () => {
            window.location.href = '/';
        });
    </script>
</body>
</html>
