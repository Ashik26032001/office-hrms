[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py migrate --settings=config.settings_production && python manage.py collectstatic --noinput --settings=config.settings_production && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production.variables]
DJANGO_SETTINGS_MODULE = "config.settings_production"
PYTHONUNBUFFERED = "1"
